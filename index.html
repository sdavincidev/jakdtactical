<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Jak’D Tactical – Defensa y equipo táctico</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--navy:#061a36;--blue:#0f4c9a;--gold:#e0a912;--silver:#e8ecf2;--ink:#050b16;color-scheme:dark;--ac:#e0a912;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--ink);color:var(--silver);font-family:Barlow,Arial,sans-serif;overflow-x:hidden}
h1,h2,.big{font-family:"Bebas Neue",Impact,"Arial Narrow",sans-serif;font-weight:400;letter-spacing:.02em;margin:0}
a{color:inherit;text-decoration:none}:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.btn{display:inline-block;background:var(--gold);color:#101010;font-weight:600;border-radius:10px;padding:14px 28px;font-size:1.05rem;transition:transform .2s,box-shadow .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(224,169,18,.4)}
.btn.ghost{background:none;border:2px solid var(--silver);color:var(--silver)}
/* ===== ENCABEZADO ===== */
header{position:absolute;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:10;display:flex;align-items:center;gap:14px;padding:14px clamp(16px,4vw,48px)}
header img{height:64px;border-radius:10px}header .big{font-size:1.7rem;flex:1}
header .btn{padding:10px 20px}
/* ===== HERO ===== */
.hero{position:relative;min-height:100svh;overflow:hidden;background:var(--navy)}
.bg{position:absolute;inset:-20%;background:radial-gradient(40% 40% at 20% 30%,var(--blue),transparent 70%),radial-gradient(35% 35% at 80% 70%,color-mix(in srgb,var(--ac) 45%,transparent),transparent 70%);animation:drift 18s ease-in-out infinite alternate;transition:background .6s}
.bg::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,transparent 0 46px,rgba(255,255,255,.035) 46px 48px)}
@keyframes drift{to{transform:translate3d(6%,4%,0) rotate(6deg) scale(1.1)}}
.slide{position:absolute;inset:0;display:grid;grid-template-columns:1.1fr 1fr;align-items:center;gap:clamp(16px,4vw,64px);padding:110px clamp(16px,6vw,96px) 90px;opacity:0;visibility:hidden;transition:opacity 1s ease,visibility 0s 1s}
.slide.on{opacity:1;visibility:visible;transition:opacity 1s ease}
.txt>*{opacity:0;transform:translateX(-48px);transition:opacity .9s ease,transform 1s cubic-bezier(.2,.8,.2,1)}
.on .txt>*{opacity:1;transform:none}.on .txt>:nth-child(2){transition-delay:.12s}.on .txt>:nth-child(3){transition-delay:.24s}.on .txt>:nth-child(4){transition-delay:.36s}
.tag{display:inline-block;border:2px solid var(--ac);color:var(--ac);border-radius:99px;padding:4px 14px;font-weight:600;margin-bottom:14px}
.txt h1{font-size:clamp(2.6rem,7vw,6rem);line-height:.95}
.txt p{font-size:1.2rem;max-width:30ch;margin:14px 0}.price{font-family:"Bebas Neue",Impact,sans-serif;font-size:2.4rem;color:var(--ac);margin-bottom:20px}
.btns{display:flex;gap:12px;flex-wrap:wrap}
.frame{justify-self:center;width:min(100%,380px);aspect-ratio:4/5;clip-path:polygon(0 0,100% 0,100% 76%,50% 100%,0 76%);background:var(--ac);padding:0;transform:translateX(80px) scale(.9) rotate(2deg);transition:transform 1.2s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(0 20px 40px rgba(0,0,0,.5))}
.on .frame{transform:none}.frame img{width:100%;height:100%;object-fit:cover;display:block;transform:scale(1.15);transition:transform 6.5s linear}.on .frame img{transform:scale(1)}
/* ===== CONTROLES ===== */
.ctl{position:absolute;left:0;right:0;bottom:calc(26px + env(safe-area-inset-bottom,0px));z-index:5;display:flex;justify-content:center;align-items:center;gap:10px}
.dot{width:46px;height:5px;border-radius:3px;background:rgba(255,255,255,.25);border:0;padding:0;overflow:hidden;cursor:pointer;position:relative}
.dot i{position:absolute;inset:0;background:var(--gold);transform:scaleX(0);transform-origin:left}
.dot.on i{animation:fill 6s linear forwards}.dot.done i{transform:none}
.hero:hover .dot.on i,.hero.pause .dot.on i{animation-play-state:paused}
@keyframes fill{to{transform:scaleX(1)}}
.arr{background:rgba(255,255,255,.12);border:0;color:#fff;width:42px;height:42px;border-radius:50%;font-size:1.2rem;cursor:pointer}
/* ===== CATEGORIAS + PIE ===== */
.cats{padding:56px clamp(16px,6vw,96px);background:var(--ink);text-align:center}
.cats h2{font-size:clamp(2rem,5vw,3.2rem);margin-bottom:20px}
.row{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-bottom:28px}
.row a{border:1px solid #2b3a55;border-radius:99px;padding:10px 20px;transition:background .2s,border-color .2s}.row a:hover{background:#0f2748;border-color:var(--gold)}
footer{padding:28px;text-align:center;border-top:1px solid #16233a;color:#9fb0c8}footer a{color:var(--gold)}
@media(max-width:760px){.slide{grid-template-columns:1fr;align-content:center;text-align:center;padding-top:96px}.frame{order:-1;width:min(62%,240px)}.txt p{margin-inline:auto}.btns{justify-content:center}header .big{font-size:1.3rem}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}.dot.on i{animation-duration:6s!important}}
</style></head><body>

const $=i=>document.getElementById(i),M=n=>"$"+n.toLocaleString("es-CO");
document.querySelectorAll(".catlink").forEach(a=>{a.href=CATALOG_URL;a.target="_blank";a.rel="noopener"});
$("wa").href="https://wa.me/"+WA;
$("slides").innerHTML=D.map((s,k)=>`<article class="slide" style="--ac:${s.c}" aria-label="${s.n}"><div class="txt"><span class="tag">Más vendido</span><h1>${s.n}</h1><p>${s.d}</p><div class="price">${M(s.p)}</div><div class="btns"><a class="btn catlink" href="${CATALOG_URL}" target="_blank" rel="noopener">Ver en el catálogo</a></div></div><div class="frame"><img src="${s.i}" alt="${s.n}"></div></article>`).join("");
$("dots").innerHTML=D.map((s,k)=>`<button class="dot" data-k="${k}" aria-label="Ir a ${s.n}"><i></i></button>`).join("");
const sl=[...document.querySelectorAll(".slide")],dt=[...document.querySelectorAll(".dot")];let cur=-1;
function go(k){k=(k+D.length)%D.length;if(k==cur)return;cur=k;
sl.forEach((e,j)=>e.classList.toggle("on",j==k));
dt.forEach((e,j)=>{e.classList.remove("on","done");void e.offsetWidth;if(j<k)e.classList.add("done");if(j==k)e.classList.add("on")});
document.getElementById("hero").style.setProperty("--ac",D[k].c)}
dt.forEach(d=>d.querySelector("i").addEventListener("animationend",()=>go(cur+1)));
document.addEventListener("click",e=>{const d=e.target.closest(".dot");if(d)go(+d.dataset.k);if(e.target.id=="nx")go(cur+1);if(e.target.id=="pv")go(cur-1)});
let sx=0;const h=$("hero");h.addEventListener("touchstart",e=>{sx=e.touches[0].clientX;h.classList.add("pause")},{passive:true});
h.addEventListener("touchend",e=>{h.classList.remove("pause");const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>50)go(cur+(dx<0?1:-1))});
go(0);
