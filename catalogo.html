<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Jak’D Tactical – Catálogo</title>
<style>
:root{--bg:#0b0b0d;--card:#17171b;--gold:#d4a017;--txt:#f2f2f2;--mut:#9a9aa3;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,Segoe UI,Arial,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:12px;padding:10px 16px;background:#0b1e3a;border-bottom:2px solid var(--gold)}
header img{height:56px;border-radius:8px}header h1{flex:1;margin:0;font-size:1.2rem;color:var(--gold);letter-spacing:1px}
#cb{background:var(--gold);color:#000;border:0;border-radius:20px;padding:9px 16px;font-weight:700;cursor:pointer}
nav{display:flex;gap:8px;overflow-x:auto;padding:14px 16px}nav button{white-space:nowrap;background:var(--card);color:var(--txt);border:1px solid #333;border-radius:20px;padding:8px 14px;cursor:pointer}
nav button.on{background:var(--gold);color:#000;border-color:var(--gold)}
main{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px;padding:0 16px 40px}
.card{position:relative;background:var(--card);border:1px solid #2a2a30;border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.card img{width:100%;aspect-ratio:4/5;object-fit:cover;display:block}
.info{position:absolute;inset:0 0 54px;background:rgba(5,15,35,.94);padding:14px;opacity:0;transition:.25s;overflow:auto;display:flex;flex-direction:column;gap:6px}
.card:hover .info,.card.open .info{opacity:1}.info b{color:var(--gold);font-size:1.05rem}.info .pr{font-size:1.2rem;font-weight:700}.info small{color:var(--mut)}.info p{margin:0;font-size:.88rem;line-height:1.4}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;height:54px;position:relative;z-index:2;background:var(--card)}
.bar span{font-size:.85rem;font-weight:600}.add{background:var(--gold);color:#000;border:0;border-radius:8px;padding:7px 11px;font-weight:700;cursor:pointer}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;z-index:30}#ov.on{display:block}
#cart{position:fixed;top:0;right:-100%;width:min(380px,100%);height:100%;background:#101015;z-index:31;transition:.3s;display:flex;flex-direction:column;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));border-left:2px solid var(--gold)}
#cart.on{right:0}#cart h2{margin:0 0 10px;color:var(--gold)}#items{flex:1;overflow:auto}
.it{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid #26262c;font-size:.88rem}.it img{width:46px;height:56px;object-fit:cover;border-radius:6px}.it div{flex:1}
.it button{background:#26262c;color:#fff;border:0;border-radius:6px;width:26px;height:26px;cursor:pointer}
#tot{font-size:1.2rem;font-weight:700;margin:12px 0}#ws{background:#25d366;color:#000;border:0;border-radius:10px;padding:12px;font-weight:700;cursor:pointer}
.x{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));right:12px;background:none;border:0;color:#fff;font-size:1.5rem;cursor:pointer}
</style></head><body>
